<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>View Page</title>
    <style>
        body { 
            background-color: #1e1e1e; /* 落ち着いたダークグレー */
            color: #d4d4d4; 
            font-family: sans-serif; 
            margin: 0; 
            padding: 20px; 
            line-height: 1.6;
            word-wrap: break-word;
        }
        #display { white-space: pre-wrap; font-size: 18px; }
    </style>
</head>
<body>
    <div id="display">接続中...</div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

         const firebaseConfig = {
  apiKey: "AIzaSyAHN2SoKuuuAwh3MAiTiA6LkNbL4qPMZ0o",
  authDomain: "stealth-note-93deb.firebaseapp.com",
  databaseURL: "https://stealth-note-93deb-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "stealth-note-93deb",
  storageBucket: "stealth-note-93deb.firebasestorage.app",
  messagingSenderId: "1025590345387",
  appId: "1:1025590345387:web:10e5bfc3a97f14e79301ee"
};

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const auth = getAuth();

        signInAnonymously(auth).then(() => {
            onValue(ref(db, 'shared_note/text'), (snapshot) => {
                const data = snapshot.val();
                document.getElementById('display').innerText = data || "まだ入力がありません";
                window.scrollTo(0, document.body.scrollHeight);
            });
        }).catch((error) => {
            document.getElementById('display').innerText = "接続エラー: " + error.message;
        });
    </script>
</body>
</html>
