<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>View Page</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #fff; line-height: 1.8; }
        #display { white-space: pre-wrap; word-wrap: break-word; font-size: 16px; }
    </style>
</head>
<body>
    <div id="display">ここにリアルタイムで表示されます...</div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        // ★ここにもステップ1でメモした内容を貼り付ける
        const firebaseConfig = {
  apiKey: "AIzaSyAHN2SoKuuuAwh3MAiTiA6LkNbL4qPMZ0o",
  authDomain: "stealth-note-93deb.firebaseapp.com",
  databaseURL: "https://stealth-note-93deb-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "stealth-note-93deb",
  storageBucket: "stealth-note-93deb.firebasestorage.app",
  messagingSenderId: "1025590345387",
  appId: "1:1025590345387:web:10e5bfc3a97f14e79301ee"
};
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        onValue(ref(db, 'shared_note/text'), (snapshot) => {
            document.getElementById('display').innerText = snapshot.val() || "";
            window.scrollTo(0, document.body.scrollHeight);
        });
    </script>
</body>
</html>
